node:
  data_dir: "/var/lib/oikos"
  cert_path: "/etc/oikos/certs/node.crt"
  key_path: "/etc/oikos/certs/node.key"
panel:
  address: "panel.example.com:9091"
  ca_path: "/etc/oikos/certs/ca.crt"
runtime:
  engine: "docker"
  docker_socket: "unix:///var/run/docker.sock"
  frp_binary: "/usr/local/bin/frpc"
  frp_config: "/var/lib/oikos/frpc.toml"
  frp_server_addr: "frps.example.com"
  frp_server_port: 7000
  frp_token: ""
  frp_remote_port_min: 30000
  frp_remote_port_max: 40000
api:
  local_grpc_port: 9190
log:
  level: "info"
observability:
  bind_addr: "127.0.0.1:9191"
  metrics_path: "/metrics"
  health_path: "/healthz"
  event_retention_days: 30
  metrics_interval: "15s"
  health_interval: "15s"
filesystem:
  server_root: "/var/lib/oikos/servers"
  backup_root: "/var/lib/oikos/backups"
  upload_chunk_bytes: 1048576
  max_upload_bytes: 10737418240
sftp:
  enabled: false
  bind_addr: "127.0.0.1:2222"
  host_key_path: "/etc/oikos/certs/sftp_host.key"
